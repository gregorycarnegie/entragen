[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
common = { path = "../common" }

[dependencies.web-sys]
version = "0.3.106"
features = [
  "File",
  "FileList",
  "FileReader",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "HtmlAnchorElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "DragEvent",
  "DataTransfer",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Event",
  "InputEvent",
]
